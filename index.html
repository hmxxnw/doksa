
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문학 시험 대비 주관식 퀴즈</title>
<style>
:root {
  color-scheme: dark;
  --bg: #151514;
  --panel: #232220;
  --line: #3c3935;
  --txt: #f2f0ed;
  --muted: #aaa39a;
  --blue: #9dbced;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--txt);
  font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
  line-height: 1.6;
}
.wrap {
  max-width: 780px;
  margin: 0 auto;
  padding: 34px 20px 80px;
}
h1 { font-size: 28px; margin: 0 0 3px; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 17px;
  padding: 22px;
  margin: 14px 0;
}
.label {
  font-size: 13px;
  color: var(--muted);
  font-weight: 700;
  margin: 0 0 12px;
}
.choices, .reviewbar {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}
.reviewbar { margin-top: 15px; }
.chip {
  background: #242e40;
  border: 1px solid #7e9fce;
  color: #b4cefa;
  padding: 9px 15px;
  border-radius: 24px;
  cursor: pointer;
  font-weight: 650;
  font-size: 14px;
}
.chip.active {
  background: #a0bdeb;
  color: #14233a;
}
.stats {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  color: var(--muted);
  font-size: 13px;
}
.bar {
  height: 7px;
  background: #3a3835;
  border-radius: 8px;
  overflow: hidden;
  margin: 12px 0 25px;
}
.fill {
  height: 100%;
  background: #95b7ed;
  transition: width .2s;
}
.question {
  font-size: 21px;
  font-weight: 750;
  line-height: 1.55;
  margin: 14px 0 22px;
  word-break: keep-all;
}
.tag {
  color: #9dbced;
  font-size: 13px;
  font-weight: 700;
}
.answer {
  width: 100%;
  min-height: 112px;
  border-radius: 12px;
  background: #191919;
  border: 1px solid #56514c;
  color: var(--txt);
  font: inherit;
  padding: 15px;
  resize: vertical;
}
.btn {
  border: 0;
  border-radius: 12px;
  padding: 14px 18px;
  font-weight: 750;
  font-size: 15px;
  cursor: pointer;
  background: #95b5e6;
  color: #18253a;
}
.btn.secondary {
  background: transparent;
  color: #ddd;
  border: 1px solid #514d48;
}
.btn:disabled {
  opacity: .3;
  cursor: not-allowed;
}
.btnrow, .grade {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}
.btnrow > *, .grade > * { flex: 1; }
.result {
  margin-top: 17px;
  padding: 17px;
  background: #30302d;
  border-radius: 12px;
  border: 1px solid #57534c;
}
.result strong { color: #b6d0ff; }
.result p { margin: 7px 0 0; }
.small { font-size: 13px; color: var(--muted); }
.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-top: 18px;
  flex-wrap: wrap;
}
.toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 14px;
}
.mode-label {
  color: #b6d0ff;
  font-size: 13px;
  margin-top: 10px;
}
.empty {
  text-align: center;
  color: var(--muted);
  padding: 20px;
}
.grade .selected {
  outline: 2px solid #fff;
  outline-offset: 2px;
}
.hidden { display: none !important; }
button:hover:not(:disabled) { filter: brightness(1.09); }
button:focus-visible, textarea:focus-visible {
  outline: 3px solid white;
  outline-offset: 2px;
}
@media(max-width:500px) {
  .wrap { padding: 22px 14px 55px; }
  h1 { font-size: 24px; }
  .panel { padding: 17px; }
  .question { font-size: 19px; }
}
</style>
</head>
<body>

<main class="wrap">
  <h1>문학 시험 대비 주관식 퀴즈</h1>
  <p class="sub">
    이강백 「파수꾼」 · 이청준 「소문의 벽」
    — 줄거리 제외 · 총 44문제
  </p>

  <section class="panel">
    <div class="label">작품 선택</div>
    <div class="choices" id="works"></div>

    <div class="reviewbar">
      <button class="chip active" id="allmode">전체 문제 풀기</button>
      <button class="chip" id="wrongmode">
        오답만 다시 풀기 (<span id="wrongcount">0</span>)
      </button>
    </div>
    <div class="mode-label" id="modeLabel"></div>

    <p class="label" style="margin:18px 0 9px">출제 순서</p>
    <div class="choices">
      <button class="chip active" id="ordered">순서대로</button>
      <button class="chip" id="random">랜덤</button>
    </div>
  </section>

  <section class="panel">
    <div class="stats">
      <span id="counter"></span>
      <span id="progress"></span>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="tag" id="tag"></div>

    <div class="empty hidden" id="empty">
      다시 풀 오답이 없어요.<br>
      전체 문제로 돌아가거나 작품을 변경해 주세요.
    </div>

    <div id="questionArea">
      <div class="question" id="question"></div>
      <label class="label" for="answer">
        직접 답안을 작성해 보세요
      </label>
      <textarea
        class="answer"
        id="answer"
        placeholder="여기에 정답을 입력하세요"
      ></textarea>

      <div class="btnrow">
        <button class="btn" id="reveal">
          정답 및 해설 확인
        </button>
      </div>

      <div class="result hidden" id="result">
        <strong id="correct"></strong>
        <p id="explanation"></p>
        <p class="small">
          서술형은 모범 답안과 의미를 비교해 직접 채점해 주세요.
        </p>
        <div class="grade">
          <button class="btn secondary" id="markwrong">
            틀렸어요
          </button>
          <button class="btn" id="markright">
            맞혔어요
          </button>
        </div>
      </div>

      <div class="btnrow">
        <button class="btn secondary" id="prev">← 이전</button>
        <button class="btn" id="next">다음 →</button>
      </div>
    </div>
  </section>

  <div class="footer">
    <label class="toggle">
      <input type="checkbox" id="showall">
      정답 항상 표시
    </label>
    <button class="btn secondary" id="reset">
      진행 기록 초기화
    </button>
  </div>

  <p class="small" style="margin-top:23px">
    Enter: 정답 확인 / 다음 문제 · Shift+Enter: 줄바꿈<br>
    답안과 채점 기록은 현재 브라우저에 저장됩니다.
  </p>
</main>

    ex:"치료 과정이 기존 억압을 재현한다."

  {

    q:"'소문'이 확인된 사실보다 더 강한 억압으로 작용할 수 있는 이유는?",
    a:"사실 여부와 관계없이 평가나 처벌에 대한 두려움을 주어 사람들이 스스로 표현을 제한하게 만들기 때문이다.",

  {

    q:"문학 작품을 단순한 허구로만 보는 태도가 지닌 한계를 서술하시오.",
    a:"허구적 형식에도 작가의 경험과 내면적 진실이 담길 수 있으므로 허구라는 이유로 배제하면 중요한 자기 표현의 의미를 놓친다.",
    ex:"허구적 형식과 내면적 진실은 양립할 수 있다."
  },
  {
    section:"소문의 벽",
    q:"'나'가 박준의 문제를 이해하려는 과정이 독자에게 갖는 효과를 서술하시오.",
    a:"독자는 '나'의 탐색을 따라가며 박준을 단순한 광인으로 판단하지 않고 그 배경에 있는 억압과 진술의 문제를 이해하게 된다.",
    ex:"서술자의 탐색이 독자의 이해를 심화한다."
  }
];

const $ = id => document.getElementById(id);
const STORAGE_KEY = "literatureQuizV1";

let work = "전체";
let mode = "all";
let random = false;
let order = [];
let index = 0;
let answers = {};
let seen = {};
let grades = {};
let reviewSeen = {};
let reviewAnswers = {};

try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  answers = saved.answers || {};
  seen = saved.seen || {};
  grades = saved.grades || {};
} catch (error) {
  console.warn("저장된 기록을 불러오지 못했습니다.", error);
}

function save() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify({ answers, seen, grades })
    );
  } catch (error) {
    console.warn("기록을 저장하지 못했습니다.", error);
  }
}

function selectedIds() {
  return DATA.map((_, i) => i).filter(i =>
    (work === "전체" || DATA[i].section === work) &&
    (mode === "all" || grades[i] === "wrong")
  );
}

function wrongCount() {
  return DATA.filter((q, i) =>
    grades[i] === "wrong" &&
    (work === "전체" || q.section === work)
  ).length;
}

function currentId() {
  return order[index];
}

function isRevealed(id) {
  if (mode === "wrong") {
    return !!reviewSeen[id];
  }
  return !!seen[id] || $("showall").checked;
}

function updateWorks() {
  const root = $("works");
  root.innerHTML = "";

  ["전체", "파수꾼", "소문의 벽"].forEach(name => {
    const button = document.createElement("button");
    const count = name === "전체"
      ? DATA.length
      : DATA.filter(q => q.section === name).length;

    button.className = "chip" + (work === name ? " active" : "");
    button.textContent = `${name} (${count})`;

    button.onclick = () => {
      work = name;
      updateWorks();
      makeOrder();
    };

    root.appendChild(button);
  });
}

function makeOrder() {
  order = selectedIds();

  if (random) {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
  }

  index = 0;
  render();
}

function startReview() {
  mode = "wrong";

  // 복습을 새로 시작할 때만 답안과 공개 상태 초기화
  reviewSeen = {};
  reviewAnswers = {};

  makeOrder();
}

function render() {
  $("wrongcount").textContent = wrongCount();
  $("allmode").classList.toggle("active", mode === "all");
  $("wrongmode").classList.toggle("active", mode === "wrong");

  $("modeLabel").textContent = mode === "wrong"
    ? "오답 복습 중 — 정답은 다시 가려집니다."
    : "";

  const empty = order.length === 0;

  $("empty").classList.toggle("hidden", !empty);
  $("questionArea").classList.toggle("hidden", empty);

  $("counter").textContent = empty
    ? "문제 0 / 0"
    : `문제 ${index + 1} / ${order.length}`;

  $("progress").textContent = `오답 ${wrongCount()}문항`;

  $("fill").style.width = empty
    ? "0%"
    : `${(index + 1) / order.length * 100}%`;

  if (empty) {
    $("tag").textContent = "";
    $("empty").innerHTML = mode === "wrong"
      ? "다시 풀 오답이 없어요.<br>전체 문제로 돌아가거나 작품을 변경해 주세요."
      : "출제할 문제가 없습니다.";
    return;
  }

  const id = currentId();
  const q = DATA[id];

  $("tag").textContent = q.section;
  $("question").textContent = q.q;

  $("answer").value = mode === "wrong"
    ? (reviewAnswers[id] || "")
    : (answers[id] || "");

  $("prev").disabled = index === 0;

  // 마지막 문제라도 정답 확인 후 마무리할 수 있도록 함
  const last = index === order.length - 1;
  $("next").disabled = false;
  $("next").textContent = last ? "학습 마무리 →" : "다음 →";

  const visible = isRevealed(id);

  $("result").classList.toggle("hidden", !visible);
  $("correct").textContent = "모범 답안: " + q.a;
  $("explanation").textContent = q.ex;

  $("reveal").textContent = visible
    ? "정답 확인 완료"
    : "정답 및 해설 확인";

  // 오답 복습에서는 새로 채점하기 전까지 선택 표시 제거
  const grade = mode === "wrong" && !reviewSeen[id]
    ? null
    : grades[id];

  $("markwrong").classList.toggle("selected", grade === "wrong");
  $("markright").classList.toggle("selected", grade === "right");
}

function revealAnswer() {
  if (!order.length) return;

  const id = currentId();

  if (mode === "wrong") {
    reviewSeen[id] = true;
  } else {
    seen[id] = true;
    save();
  }

  render();
}

function gradeAnswer(value) {
  if (!order.length) return;

  const id = currentId();

  if (!isRevealed(id)) {
    revealAnswer();
  }

  grades[id] = value;

  if (mode === "wrong") {
    reviewSeen[id] = true;
  } else {
    seen[id] = true;
  }

  save();

  // 채점 직후에는 현재 문제를 유지
  // Enter를 눌렀을 때 다음 문제로 이동
  render();
}

function nextQuestion() {
  if (!order.length) return;

  const id = currentId();

  // 정답이 공개되지 않았다면 먼저 정답 확인
  if (!isRevealed(id)) {
    revealAnswer();
    return;
  }

  // 오답 복습에서 맞힌 문제는 다음으로 넘어갈 때 제외
  if (mode === "wrong" && grades[id] === "right") {
    order.splice(index, 1);

    if (order.length === 0) {
      render();
      return;
    }

    if (index >= order.length) {
      index = order.length - 1;
    }

    render();
    return;
  }

  if (index < order.length - 1) {
    index++;
    render();
    return;
  }

  // 마지막 문제의 학습 마무리
  if (mode === "wrong") {
    const remaining = wrongCount();

    if (remaining === 0) {
      makeOrder();
    } else {
      const again = confirm(
        `오답 ${remaining}문항이 남아 있어요.\n오답 복습을 다시 시작할까요?`
      );

      if (again) startReview();
    }
  } else {
    alert(
      `총 ${order.length}문제 학습을 마쳤어요!\n` +
      `현재 오답 ${wrongCount()}문항이 있어요.`
    );
  }
}

$("answer").addEventListener("input", event => {
  if (!order.length) return;

  const id = currentId();

  if (mode === "wrong") {
    reviewAnswers[id] = event.target.value;
  } else {
    answers[id] = event.target.value;
    save();
  }
});

$("reveal").onclick = revealAnswer;
$("markwrong").onclick = () => gradeAnswer("wrong");
$("markright").onclick = () => gradeAnswer("right");

$("prev").onclick = () => {
  if (index > 0) {
    index--;
    render();
  }
};

$("next").onclick = nextQuestion;

$("allmode").onclick = () => {
  mode = "all";
  makeOrder();
};

$("wrongmode").onclick = startReview;

$("ordered").onclick = () => {
  random = false;
  $("ordered").classList.add("active");
  $("random").classList.remove("active");
  makeOrder();
};

$("random").onclick = () => {
  random = true;
  $("random").classList.add("active");
  $("ordered").classList.remove("active");
  makeOrder();
};

$("showall").onchange = render;

$("reset").onclick = () => {
  if (!confirm(
    "입력한 답안, 정답 확인 기록, 오답 표시를 모두 지울까요?"
  )) return;

  answers = {};
  seen = {};
  grades = {};
  reviewSeen = {};
  reviewAnswers = {};

  save();
  makeOrder();
};

// Enter 단축키
document.addEventListener("keydown", event => {
  if (
    event.key !== "Enter" ||
    event.isComposing ||
    event.repeat ||
    event.shiftKey ||
    event.ctrlKey ||
    event.altKey ||
    event.metaKey
  ) return;

  if (!order.length) return;

  event.preventDefault();

  const id = currentId();

  if (!isRevealed(id)) {
    revealAnswer();
  } else {
    nextQuestion();
  }
});

// 초기 실행
updateWorks();
makeOrder();
</script>
